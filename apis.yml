aid: agnost-ai
name: Agnost AI
description: >-
  Agnost AI is a production monitoring and product-analytics platform for teams
  building chat and voice AI agents. It continuously reads production agent
  conversations, MCP tool calls, and OpenTelemetry traces, clusters recurring
  intents, feature requests, frustration, and failure patterns, and catches
  agent failures that offline evals miss. It then turns the highest-impact
  patterns into reviewed fixes, including pull requests against prompts, tools,
  and agent harnesses. Agnost is OpenTelemetry-native, works with any LLM and
  framework, and ships SDKs for Python and TypeScript conversation tracking,
  MCP-server analytics (Python, TypeScript, Go), plus a hosted OAuth-protected
  MCP server for querying your dashboard from Claude Desktop, Cursor, and any MCP
  client. Founded in 2025 and part of Y Combinator's Summer 2026 (S26) batch.
